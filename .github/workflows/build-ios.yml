name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Patch expo-modules-core Swift 5 compatibility
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "node_modules/expo-modules-core/ios/Core/Views/SwiftUI/SwiftUIHostingView.swift",
              "node_modules/expo-modules-core/ios/Core/Views/SwiftUI/SwiftUIVirtualView.swift",
              "node_modules/expo-modules-core/ios/Core/Views/ViewDefinition.swift"
            ];
            for (const f of files) {
              if (fs.existsSync(f)) {
                let content = fs.readFileSync(f, "utf8");
                content = content.replace(/@MainActor\s+(AnyExpoSwiftUIHostingView|ExpoSwiftUI\.ViewWrapper|AnyArgument)/g, "$1");
                fs.writeFileSync(f, content);
                console.log("Patched", f);
              }
            }
          '

      - name: Bundle Bare worklet
        run: npm run bundle:bare

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios

      - name: Patch Podfile for Swift 5 and iOS 15.1
        run: |
          node -e '
            const fs = require("fs");
            let p = fs.readFileSync("ios/Podfile", "utf8");
            const patch = `
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["SWIFT_VERSION"] = "5.0"
                    config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
                    config.build_settings["IPHONEOS_DEPLOYMENT_TARGET"] = "15.1"
                  end
                end
            `;
            p = p.replace(/post_install do \|installer\|/, "post_install do |installer|\n" + patch);
            fs.writeFileSync("ios/Podfile", p);
          '

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Xcode Archive (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" -json | jq -r '.workspace.schemes[] | select(test("HelloPear"))' | head -n 1)
          echo "Building workspace: $WORKSPACE with app scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.1 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_VERSION=5.0 \
            archive

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          echo "Packaging app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q HelloPear.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloPear-iOS
          path: HelloPear.ipa
          retention-days: 7
