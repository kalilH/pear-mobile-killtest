<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="aperture-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>
    <linearGradient id="wave-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="512" height="512" rx="115" fill="url(#aperture-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Center Focal Core -->
  <circle cx="256" cy="256" r="20" fill="url(#wave-cyan)" />

  <!-- Tri-Blade Optical Radar Vortex -->
  <g transform="rotate(0 256 256)">
    <path d="M 256 188 A 68 68 0 0 1 324 256 A 120 120 0 0 1 230 366" fill="none" stroke="url(#wave-cyan)" stroke-width="20" stroke-linecap="round" />
  </g>
  <g transform="rotate(120 256 256)">
    <path d="M 256 188 A 68 68 0 0 1 324 256 A 120 120 0 0 1 230 366" fill="none" stroke="url(#wave-cyan)" stroke-width="20" stroke-linecap="round" opacity="0.85" />
  </g>
  <g transform="rotate(240 256 256)">
    <path d="M 256 188 A 68 68 0 0 1 324 256 A 120 120 0 0 1 230 366" fill="none" stroke="url(#wave-cyan)" stroke-width="20" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
