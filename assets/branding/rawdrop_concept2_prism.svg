<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="prism-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151C" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <linearGradient id="prism-facet-a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C4152" />
      <stop offset="100%" stop-color="#1F222C" />
    </linearGradient>

    <linearGradient id="laser-cyan-prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- iOS Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#prism-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Octahedral Prism Crown -->
  <polygon points="256,100 376,188 136,188" fill="#2E3342" stroke="rgba(255,255,255,0.2)" stroke-width="3" />

  <!-- Left Main Optical Facet -->
  <polygon points="136,188 256,188 256,410 102,238" fill="url(#prism-facet-a)" stroke="rgba(255,255,255,0.14)" stroke-width="3" />

  <!-- Right Main Optical Facet -->
  <polygon points="376,188 256,188 256,410 410,238" fill="#0E1015" stroke="rgba(255,255,255,0.06)" stroke-width="3" />

  <!-- Central Optical Slit -->
  <line x1="256" y1="100" x2="256" y2="418" stroke="rgba(255,255,255,0.7)" stroke-width="5" stroke-linecap="round" />

  <!-- Razor Apex Accent / Frictionless Drop Needle -->
  <path d="M 222,316 L 256,418 L 290,316" fill="none" stroke="url(#laser-cyan-prism)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="418" r="8" fill="#38BDF8" />
</svg>
