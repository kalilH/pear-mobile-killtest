<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="beacon-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <linearGradient id="wave-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="512" height="512" rx="115" fill="url(#beacon-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Top Emitter Node -->
  <circle cx="256" cy="144" r="22" fill="url(#wave-cyan)" />

  <!-- Downward Cascading Ripples -->
  <path d="M 196 220 A 85 85 0 0 0 316 220" fill="none" stroke="url(#wave-cyan)" stroke-width="20" stroke-linecap="round" />
  <path d="M 154 290 A 145 145 0 0 0 358 290" fill="none" stroke="url(#wave-cyan)" stroke-width="20" stroke-linecap="round" opacity="0.8" />
  <path d="M 112 360 A 205 205 0 0 0 400 360" fill="none" stroke="url(#wave-cyan)" stroke-width="20" stroke-linecap="round" opacity="0.5" />
</svg>
