<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="r-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>
    <linearGradient id="wave-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="512" height="512" rx="115" fill="url(#r-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Vertical Transmitter Backbone -->
  <line x1="180" y1="120" x2="180" y2="392" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />

  <!-- Inner Harmonic Radar Loop -->
  <path d="M 180 154 A 60 60 0 0 1 180 274" fill="none" stroke="url(#wave-cyan)" stroke-width="22" stroke-linecap="round" />

  <!-- Outer Harmonic Radar Loop -->
  <path d="M 180 110 A 104 104 0 0 1 180 318" fill="none" stroke="url(#wave-cyan)" stroke-width="22" stroke-linecap="round" opacity="0.8" />

  <!-- Kinetic Downward Wave Kick -->
  <path d="M 224 274 C 258 300 310 350 334 392" fill="none" stroke="url(#wave-cyan)" stroke-width="26" stroke-linecap="round" />
  <circle cx="334" cy="392" r="15" fill="url(#wave-cyan)" />
</svg>
