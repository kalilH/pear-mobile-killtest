<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="dropwave-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>
    <linearGradient id="wave-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="512" height="512" rx="115" fill="url(#dropwave-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Central Precision Teardrop / Emitter Core -->
  <path d="M 256,170 C 273,170 286,187 286,212 C 286,242 256,276 256,276 C 256,276 226,242 226,212 C 226,187 239,170 256,170 Z" fill="url(#wave-cyan)" filter="url(#soft-glow)" />

  <!-- Inner Parabolic Wave -->
  <path d="M 315,246 C 324,196 295,136 256,136 C 217,136 188,196 197,246 C 201,288 231,328 256,350 C 281,328 311,288 315,246" fill="none" stroke="url(#wave-cyan)" stroke-width="18" stroke-linecap="round" />

  <!-- Outer Parabolic Wave -->
  <path d="M 362,264 C 375,188 324,94 256,94 C 188,94 137,188 150,264 C 158,324 196,384 256,418 C 316,384 354,324 362,264" fill="none" stroke="url(#wave-cyan)" stroke-width="18" stroke-linecap="round" opacity="0.65" />
</svg>
