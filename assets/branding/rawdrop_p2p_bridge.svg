<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bridge-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E1320" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>

    <linearGradient id="wave-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
  </defs>

  <!-- iOS Squircle Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bridge-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Top-Left Sender Waves -->
  <circle cx="196" cy="196" r="16" fill="url(#wave-cyan)" />
  <path d="M 160 144 A 70 70 0 0 1 230 214" fill="none" stroke="url(#wave-cyan)" stroke-width="18" stroke-linecap="round" />
  <path d="M 120 104 A 130 130 0 0 1 250 234" fill="none" stroke="url(#wave-cyan)" stroke-width="18" stroke-linecap="round" opacity="0.65" />

  <!-- Bottom-Right Receiver Waves -->
  <circle cx="316" cy="316" r="16" fill="#38BDF8" />
  <path d="M 352 368 A 70 70 0 0 1 282 298" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" />
  <path d="M 392 408 A 130 130 0 0 1 262 278" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" opacity="0.65" />
</svg>
